name: Publish to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (MAJOR.MINOR.PATCH, optional -prerelease; no leading 'v')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  aot-verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore AOT harness
        run: dotnet restore samples/GitLab.Client.AotHarness/GitLab.Client.AotHarness.csproj

      - name: Add vswhere to PATH
        # Native linking on the hosted Windows image discovers the MSVC toolchain through vswhere.
        # Make the checked image location explicit and fail with a useful error if it changes.
        shell: pwsh
        run: |
          $vswhereDirectory = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $vswhereDirectory 'vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found at '$vswhere'."
          }

          $vswhereDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Publish AOT harness (win-x64)
        # Publishing proves the native link path and trim/AOT analysis. This job does not execute
        # the harness, so CI never performs its live GitLab API call.
        run: dotnet publish samples/GitLab.Client.AotHarness/GitLab.Client.AotHarness.csproj -c Release -r win-x64 --no-restore

  publish:
    needs: aot-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write # required for NuGet trusted publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::'$version' is not a valid NuGet semantic version."
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Validate package versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          project=src/GitLab.Client/GitLab.Client.csproj
          declared_version="$(sed -nE 's:^[[:space:]]*<Version>([^<]+)</Version>[[:space:]]*$:\1:p' "$project" | head -n 1)"
          if [ -z "$declared_version" ]; then
            echo "::error file=$project::No unconditional <Version> value was found."
            exit 1
          fi

          if [ "$declared_version" != "$RELEASE_VERSION" ]; then
            echo "::error file=$project::Package version '$declared_version' does not match release version '$RELEASE_VERSION'."
            exit 1
          fi

      - name: Restore
        run: dotnet restore GitlabClient.slnx

      - name: Build (Release, 0 warnings)
        run: dotnet build GitlabClient.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution GitlabClient.slnx -c Release --no-build --no-restore

      - name: Pack release package
        run: dotnet pack src/GitLab.Client/GitLab.Client.csproj -c Release --no-build --no-restore --output ./artifacts

      - name: Verify release artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./.github/scripts/Verify-NuGetPackage.ps1 -ArtifactsDirectory ./artifacts -ExpectedVersion $env:RELEASE_VERSION

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, NOT email

      - name: Push GitLab.Client to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          dotnet nuget push "./artifacts/GitLab.Client.$RELEASE_VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
